name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v5

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.x'

    - name: Restore dependencies
      run: dotnet restore KoenZomers.Roborock.slnx

    - name: Build
      run: dotnet build KoenZomers.Roborock.slnx --configuration Release --no-restore /p:GeneratePackageOnBuild=false

    - name: Test
      run: dotnet test Tests\Tests.csproj --configuration Release --no-build --verbosity normal
