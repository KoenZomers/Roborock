name: Release

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: windows-latest

    permissions:
      id-token: write  # enable GitHub OIDC token issuance, required for NuGet Trusted Publishing
      contents: write
      packages: write

    steps:
    - uses: actions/checkout@v5

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.x'

    - name: Restore dependencies
      run: dotnet restore KoenZomers.RoboRock.slnx

    - name: Build
      run: dotnet build KoenZomers.RoboRock.slnx --configuration Release --no-restore /p:GeneratePackageOnBuild=false

    - name: Test
      run: dotnet test Tests\Tests.csproj --configuration Release --no-build --verbosity normal

    - name: Read package version and release notes
      shell: pwsh
      run: |
        [xml]$project = Get-Content Api\Api.csproj
        $version = $project.Project.PropertyGroup | ForEach-Object { $_.Version } | Where-Object { $_ } | Select-Object -First 1
        if ([string]::IsNullOrWhiteSpace($version)) {
          throw 'Api\Api.csproj does not define a Version value.'
        }

        $changelog = Get-Content CHANGELOG.md -Raw
        $versionPattern = [regex]::Escape($version)
        $match = [regex]::Match($changelog, "(?ms)^## \[$versionPattern\][^`r`n]*(?:`r?`n)+(.*?)(?=^## \[|\z)")
        if (-not $match.Success -or [string]::IsNullOrWhiteSpace($match.Groups[1].Value)) {
          throw "CHANGELOG.md does not contain release notes for version $version."
        }

        $releaseNotes = $match.Groups[1].Value.Trim()
        $releaseNotesPath = Join-Path $env:GITHUB_WORKSPACE 'release-notes.md'
        [System.IO.File]::WriteAllText($releaseNotesPath, $releaseNotes + [Environment]::NewLine, [System.Text.UTF8Encoding]::new($false))

        "PACKAGE_VERSION=$version" >> $env:GITHUB_ENV
        "RELEASE_NOTES_FILE=$releaseNotesPath" >> $env:GITHUB_ENV

    - name: Pack
      shell: pwsh
      run: |
        $env:PackageReleaseNotes = Get-Content $env:RELEASE_NOTES_FILE -Raw
        dotnet pack Api\Api.csproj --configuration Release --no-build --output .\nupkg

    - name: Create binary release asset
      shell: pwsh
      run: |
        $publishOutput = Join-Path $env:GITHUB_WORKSPACE 'Api\bin\Release\net10.0'
        if (-not (Test-Path $publishOutput)) {
          throw "Build output folder was not found: $publishOutput"
        }

        $assetPath = Join-Path $env:GITHUB_WORKSPACE "KoenZomers.Roborock.Api-v${{ env.PACKAGE_VERSION }}.zip"
        Compress-Archive -Path (Join-Path $publishOutput '*') -DestinationPath $assetPath -Force
        "BINARY_RELEASE_ASSET=$assetPath" >> $env:GITHUB_ENV

    - name: NuGet login (OIDC -> temp API key)
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Publish to NuGet
      run: dotnet nuget push .\nupkg\*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

    - name: Publish to GitHub Packages
      run: dotnet nuget push .\nupkg\*.nupkg --api-key ${{ secrets.GITHUB_TOKEN }} --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json --skip-duplicate

    - name: Create GitHub Release
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $tag = "v${{ env.PACKAGE_VERSION }}"
        gh release view $tag *> $null
        if ($LASTEXITCODE -eq 0) {
          gh release edit $tag --title $tag --notes-file $env:RELEASE_NOTES_FILE
          gh release upload $tag .\nupkg\*.nupkg $env:BINARY_RELEASE_ASSET --clobber
        } else {
          gh release create $tag .\nupkg\*.nupkg $env:BINARY_RELEASE_ASSET --title $tag --notes-file $env:RELEASE_NOTES_FILE --target $env:GITHUB_SHA
        }
