name: Publish NuGet Package

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: windows-latest

    permissions:
      id-token: write  # enable GitHub OIDC token issuance, required for NuGet Trusted Publishing
      contents: write
      packages: write

    steps:
    - uses: actions/checkout@v5

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.x'

    - name: Restore dependencies
      run: dotnet restore KoenZomers.RoboRock.slnx

    - name: Build
      run: dotnet build KoenZomers.RoboRock.slnx --configuration Release --no-restore /p:GeneratePackageOnBuild=false

    - name: Test
      run: dotnet test Tests\Tests.csproj --configuration Release --no-build --verbosity normal

    - name: Pack
      run: dotnet pack Api\Api.csproj --configuration Release --no-build --output .\nupkg

    - name: Read package version
      shell: pwsh
      run: |
        [xml]$project = Get-Content Api\Api.csproj
        $version = $project.Project.PropertyGroup | ForEach-Object { $_.Version } | Where-Object { $_ } | Select-Object -First 1
        if ([string]::IsNullOrWhiteSpace($version)) {
          throw 'Api\Api.csproj does not define a Version value.'
        }
        "PACKAGE_VERSION=$version" >> $env:GITHUB_ENV

    - name: NuGet login (OIDC -> temp API key)
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Publish to NuGet
      run: dotnet nuget push .\nupkg\*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

    - name: Publish to GitHub Packages
      run: dotnet nuget push .\nupkg\*.nupkg --api-key ${{ secrets.GITHUB_TOKEN }} --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json --skip-duplicate

    - name: Create GitHub Release
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $tag = "v${{ env.PACKAGE_VERSION }}"
        gh release view $tag *> $null
        if ($LASTEXITCODE -eq 0) {
          gh release upload $tag .\nupkg\*.nupkg --clobber
        } else {
          gh release create $tag .\nupkg\*.nupkg --title $tag --notes "Release $tag" --target $env:GITHUB_SHA
        }
